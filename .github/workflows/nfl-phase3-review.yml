name: NFL Phase 3 release checks (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'snapshot_predictions.py'
      - 'phase3/**'
      - '.github/workflows/nfl-*.yml'
permissions:
  contents: read
jobs:
  offline-release-gate:
    if: github.repository == 'dlindeman333/NFL_Parlays'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check Python contracts, workflow guards and frontend syntax
        run: |
          python -m unittest discover -s phase3 -p 'test_*.py' -v
          node phase3/check_frontend.cjs
          node phase3/test_top12_contract.cjs
          node phase3/test_player_props.cjs
          node phase3/test_advanced_optimizer.cjs
          python snapshot_predictions.py --help
      - name: Smoke-test desktop and iPhone-sized layouts with synthetic data
        run: python phase3/browser_smoke.py
