name: Comprehensive tracking offline review
on:
  push:
    branches:
      - review/comprehensive-ai-tracking
permissions:
  contents: read
jobs:
  offline-tests:
    if: github.ref == 'refs/heads/review/comprehensive-ai-tracking'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_comprehensive_review_tests.py
      - run: python -m unittest discover -s phase3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node phase3/test_comprehensive_view_review.cjs
      - run: node phase3/test_comprehensive_xlsx_review.cjs /tmp/comprehensive-review.xlsx
      - run: python phase3/check_comprehensive_xlsx_review.py /tmp/comprehensive-review.xlsx
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python phase3/comprehensive_browser_review.py
      - run: python phase3/comprehensive_cloud_browser_test.py
      - run: python phase3/browser_smoke.py
      - run: |
          for test in phase3/check_frontend.cjs phase3/test_*.cjs; do
            case "$test" in
              *test_comprehensive_xlsx_review.cjs) continue ;;
            esac
            node "$test" || exit 1
          done
