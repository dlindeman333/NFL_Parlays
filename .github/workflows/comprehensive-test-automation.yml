name: Comprehensive AI tracking TEST automation
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '11 */3 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [refresh-and-grade, capture]
        required: true
permissions:
  contents: read
concurrency:
  group: comprehensive-v4-test
  cancel-in-progress: false
jobs:
  tracking:
    if: github.repository == 'dlindeman333/NFL_Parlays_Test' && github.ref == 'refs/heads/main' && vars.NFL_V4_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      NFL_SEASON: '2026'
      NFL_V4_SUPABASE_URL: https://luxezjthznupdghmexyh.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect upcoming schedule
        id: prep
        if: github.event.schedule == '*/5 * * * *' || inputs.task == 'capture'
        run: python snapshot_predictions.py --check-prep-window
      - name: Warm browser
        if: steps.prep.outputs.eligible == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for authentic window
        id: window
        if: steps.prep.outputs.eligible == 'true'
        run: python snapshot_predictions.py --wait-for-window
      - name: Capture frozen picks and suggestions
        if: steps.window.outputs.eligible == 'true'
        env:
          NFL_V4_SERVICE_ROLE_KEY: ${{ secrets.NFL_V4_TEST_SERVICE_ROLE_KEY }}
        run: python -m phase3.comprehensive_worker capture
      - name: Refresh TEST inputs and grade captured predictions
        if: github.event.schedule == '11 */3 * * *' || inputs.task == 'refresh-and-grade'
        env:
          NFL_V4_SERVICE_ROLE_KEY: ${{ secrets.NFL_V4_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://luxezjthznupdghmexyh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NFL_V4_TEST_SERVICE_ROLE_KEY }}
        run: |
          python -m pip install -r requirements-automation.txt
          python export_automated.py
          python -m phase3.comprehensive_worker injuries
          python -m phase3.comprehensive_worker grade
