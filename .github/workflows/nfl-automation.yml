name: NFL production statistics, predictions, grading and injuries
on:
  schedule:
    # Every 3 hours; snapshots are created once per upcoming game, at least 30m before kickoff.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-automation
  cancel-in-progress: false
jobs:
  refresh-and-snapshot:
    if: github.repository == 'dlindeman333/NFL_Parlays' && vars.NFL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-automation.txt
      - run: pip install -r requirements-automation.txt
      - run: python -m playwright install --with-deps chromium
      - name: Focused production feature checks
        run: |
          python -m unittest discover -s phase3 -p 'test_*.py' -v
          node phase3/check_frontend.cjs
          python phase3/browser_smoke.py
      - name: Verify production boundary and schema before any writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python phase3/automation.py preflight
      - name: Refresh stats and upload to Supabase
        id: stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ vars.NFL_SEASON || '2026' }}
        run: python export_automated.py
      - name: Refresh weekly injury reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ vars.NFL_SEASON || '2026' }}
        run: python phase3/automation.py injuries
      - name: Archive original forward-only pregame predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ vars.NFL_SEASON || '2026' }}
        run: python snapshot_predictions.py
      - name: Grade final games from original snapshots
        if: ${{ !cancelled() && steps.stats.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NFL_SEASON: ${{ vars.NFL_SEASON || '2026' }}
        run: python phase3/automation.py grade
